<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tunahan ŞİRİN — Kişisel Marka Intro</title>
    <!-- GSAP 3.15 is vendored so renders never depend on the network. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07090d;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #07090d;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Particles converge into a technology core; system streams orbit it. -->
      <div
        id="core"
        data-composition-id="core"
        data-composition-src="compositions/core.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <!-- Name, promise line and company resolve under the core. -->
      <div
        id="title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="5.8"
        data-duration="4.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
