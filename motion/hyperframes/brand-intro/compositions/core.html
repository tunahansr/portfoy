<template>
  <style>
    @font-face {
      font-family: "Geist Mono";
      src: url("assets/fonts/geist-mono-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("assets/fonts/geist-mono-latin-ext-wght-normal.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #07090d;
    }
    #core-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
    .core-label {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px 8px 14px;
      border-radius: 999px;
      border: 1px solid #2c374c;
      background: rgba(10, 16, 34, 0.82);
      color: #f3f5f8;
      font-family: "Geist Mono", monospace;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      opacity: 0;
      will-change: transform, opacity;
    }
    .core-label i {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #45e0f0;
      box-shadow: 0 0 12px rgba(69, 224, 240, 0.7);
    }
    .core-label.is-blue i {
      background: #3d7bff;
      box-shadow: 0 0 12px rgba(61, 123, 255, 0.7);
    }
    .core-label.is-violet i {
      background: #8b6cff;
      box-shadow: 0 0 12px rgba(139, 108, 255, 0.7);
    }
  </style>
  <div id="root" data-composition-id="core" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <canvas id="core-canvas" width="1920" height="1080" data-layout-ignore></canvas>
    <div id="core-labels" data-layout-allow-overlap data-layout-allow-overflow>
      <div id="core-lbl-erp" class="core-label is-blue"><i></i><span>ERP</span></div>
      <div id="core-lbl-api" class="core-label"><i></i><span>API</span></div>
      <div id="core-lbl-pos" class="core-label"><i></i><span>POS</span></div>
      <div id="core-lbl-kurye" class="core-label"><i></i><span>Kurye</span></div>
      <div id="core-lbl-mobil" class="core-label is-blue"><i></i><span>Mobil</span></div>
      <div id="core-lbl-altyapi" class="core-label is-violet"><i></i><span>Altyapı</span></div>
    </div>
  </div>
  <script>
    (function () {
      const W = 1920;
      const H = 1080;
      const DUR = 10;
      const canvas = document.getElementById("core-canvas");
      const ctx = canvas.getContext("2d");

      // Brand tokens (src/lib/brand.ts)
      const C = {
        graphite: "#07090D",
        night: "#0A1022",
        blue: [61, 123, 255],
        cyan: [69, 224, 240],
        violet: [139, 108, 255],
        amber: [255, 181, 71],
        white: [243, 245, 248],
      };
      const rgba = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + Math.max(0, Math.min(1, a)) + ")";

      // Seeded PRNG: every frame is a pure function of t.
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const prog = (t, s, d) => clamp((t - s) / d, 0, 1);
      const eIn = gsap.parseEase("power2.in");
      const eOut = gsap.parseEase("expo.out");
      const eOut3 = gsap.parseEase("power3.out");
      const eInOut = gsap.parseEase("power3.inOut");

      const CX = 960;
      const CY0 = 520;
      const CY1 = 318;

      // Particles: scattered light/data points that gather into the core.
      const rnd = mulberry32(20240611);
      const N = 230;
      const parts = [];
      for (let i = 0; i < N; i++) {
        let x, y;
        do {
          x = 60 + rnd() * (W - 120);
          y = 50 + rnd() * (H - 100);
        } while (Math.hypot(x - CX, (y - CY0) * 1.3) < 280);
        const kind = rnd();
        parts.push({
          x,
          y,
          ph: rnd() * Math.PI * 2,
          size: 1.1 + rnd() * 1.9,
          appear: 0.1 + rnd() * 1.4,
          conv: 1.5 + rnd() * 1.1,
          dur: 1.0 + rnd() * 0.45,
          swirl: (rnd() < 0.5 ? -1 : 1) * (0.7 + rnd() * 0.9),
          col: kind < 0.55 ? C.cyan : kind < 0.9 ? C.blue : C.white,
          bright: 0.45 + rnd() * 0.55,
        });
      }

      // Three tilted orbits, two systems each.
      const orbits = [
        { rx: 290, ry: 92, tilt: -0.18, w: 0.34, col: C.cyan, reveal: 3.3 },
        { rx: 410, ry: 136, tilt: 0.13, w: -0.25, col: C.blue, reveal: 3.48 },
        { rx: 525, ry: 176, tilt: -0.05, w: 0.18, col: C.cyan, reveal: 3.66 },
      ];
      // Angle each label sits at when t = 5, so they are spread when read.
      const labels = [
        { id: "core-lbl-erp", o: 0, at5: 2.0, show: 3.85 },
        { id: "core-lbl-api", o: 0, at5: 0.72, show: 3.95 },
        { id: "core-lbl-pos", o: 1, at5: -0.62, show: 4.05 },
        { id: "core-lbl-kurye", o: 1, at5: 2.55, show: 4.15 },
        { id: "core-lbl-mobil", o: 2, at5: 1.62, show: 4.25 },
        { id: "core-lbl-altyapi", o: 2, at5: -1.66, show: 4.35 },
      ].map((l) => Object.assign(l, { el: document.getElementById(l.id) }));

      function camera(t) {
        const k = eInOut(prog(t, 5.45, 1.15));
        return { cy: CY0 + (CY1 - CY0) * k, s: 1 - 0.46 * k, k };
      }

      function orbitPoint(o, th, cam) {
        const lx = o.rx * Math.cos(th);
        const ly = o.ry * Math.sin(th);
        const c = Math.cos(o.tilt);
        const s = Math.sin(o.tilt);
        return {
          x: CX + (lx * c - ly * s) * cam.s,
          y: cam.cy + (lx * s + ly * c) * cam.s,
          depth: Math.sin(th),
        };
      }

      function particlePos(p, t) {
        const bx = p.x + Math.sin(t * 0.55 + p.ph) * 7;
        const by = p.y + Math.cos(t * 0.47 + p.ph) * 7;
        const e = eIn(prog(t, p.conv, p.dur));
        const dx = bx - CX;
        const dy = by - CY0;
        const r0 = Math.hypot(dx, dy);
        const th = Math.atan2(dy, dx) + p.swirl * e;
        const r = r0 * (1 - e);
        return { x: CX + r * Math.cos(th), y: CY0 + r * Math.sin(th), e };
      }

      function draw(t) {
        const cam = camera(t);

        // Ground: graphite with a night-navy pool behind the core.
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = C.graphite;
        ctx.fillRect(0, 0, W, H);
        const pool = ctx.createRadialGradient(CX, cam.cy, 0, CX, cam.cy, 900);
        pool.addColorStop(0, "rgba(16,28,64,0.95)");
        pool.addColorStop(0.45, "rgba(10,16,34,0.75)");
        pool.addColorStop(1, "rgba(7,9,13,0)");
        ctx.fillStyle = pool;
        ctx.fillRect(0, 0, W, H);

        ctx.globalCompositeOperation = "lighter";

        // Particles and their short motion streaks.
        let absorbed = 0;
        for (const p of parts) {
          const a0 = eOut3(prog(t, p.appear, 0.6));
          if (a0 <= 0) continue;
          const now = particlePos(p, t);
          if (now.e >= 0.999) {
            absorbed++;
            continue;
          }
          const prev = particlePos(p, Math.max(0, t - 0.07));
          const fade = 1 - clamp((now.e - 0.8) / 0.2, 0, 1);
          const a = a0 * p.bright * fade;
          const speed = Math.hypot(now.x - prev.x, now.y - prev.y);
          if (speed > 1.5) {
            const g = ctx.createLinearGradient(prev.x, prev.y, now.x, now.y);
            g.addColorStop(0, rgba(p.col, 0));
            g.addColorStop(1, rgba(p.col, a * 0.8));
            ctx.strokeStyle = g;
            ctx.lineWidth = p.size;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(now.x, now.y);
            ctx.stroke();
          }
          ctx.fillStyle = rgba(p.col, a);
          ctx.beginPath();
          ctx.arc(now.x, now.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          if (p.size > 2.4) {
            ctx.fillStyle = rgba(p.col, a * 0.12);
            ctx.beginPath();
            ctx.arc(now.x, now.y, p.size * 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        const fill = absorbed / N;

        // Core: grows with what it has absorbed, then ignites once.
        const grow = eOut(prog(t, 2.2, 1.4));
        const R = (18 + 50 * grow) * cam.s * (0.35 + 0.65 * Math.max(fill, grow));
        const cy = cam.cy;
        const glowR = R * 6;
        const glow = ctx.createRadialGradient(CX, cy, 0, CX, cy, glowR);
        glow.addColorStop(0, rgba(C.blue, 0.32 * Math.max(fill, grow)));
        glow.addColorStop(0.4, rgba(C.blue, 0.1 * Math.max(fill, grow)));
        glow.addColorStop(1, rgba(C.blue, 0));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(CX, cy, glowR, 0, Math.PI * 2);
        ctx.fill();

        const ign = prog(t, 3.4, 1.1);
        const hot = ign > 0 && ign < 1 ? Math.sin(ign * Math.PI) : 0;
        if (R > 0.5) {
          const body = ctx.createRadialGradient(CX - R * 0.25, cy - R * 0.3, 0, CX, cy, R);
          const coreHot = [
            Math.round(225 + 30 * hot),
            Math.round(246 - 30 * hot),
            Math.round(255 - 120 * hot),
          ];
          body.addColorStop(0, rgba(coreHot, 0.95));
          body.addColorStop(0.35, rgba(C.cyan, 0.75));
          body.addColorStop(0.8, rgba(C.blue, 0.45));
          body.addColorStop(1, rgba(C.blue, 0));
          ctx.fillStyle = body;
          ctx.beginPath();
          ctx.arc(CX, cy, R, 0, Math.PI * 2);
          ctx.fill();
        }

        // Inner gyroscope rings around the core.
        const ringA = grow * (1 - 0.2 * cam.k);
        if (ringA > 0) {
          ctx.lineWidth = 1.5;
          for (let k = 0; k < 3; k++) {
            const rr = R * (1.55 + k * 0.38);
            const turn = t * (0.5 + k * 0.22) + k * 1.1;
            ctx.strokeStyle = rgba(k === 1 ? C.cyan : C.blue, 0.5 * ringA);
            ctx.beginPath();
            ctx.ellipse(CX, cy, rr, rr * Math.abs(Math.cos(turn)) + 1, k * 1.05 + t * 0.12, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        // Ignition: a single amber shockwave (the energy moment).
        if (ign > 0 && ign < 1) {
          const k = eOut3(ign);
          ctx.strokeStyle = rgba(C.amber, 0.55 * (1 - ign));
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(CX, cy, R + 480 * k, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = rgba(C.amber, 0.25 * (1 - ign));
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(CX, cy, R + 300 * k, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Orbits and the data streams running along them.
        const dim = 1 - 0.5 * cam.k;
        orbits.forEach((o, oi) => {
          const rv = eInOut(prog(t, o.reveal, 0.95));
          if (rv <= 0) return;
          const start = -Math.PI / 2;
          const steps = 140;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          for (let s = 0; s <= steps * rv; s++) {
            const th = start + (s / steps) * Math.PI * 2;
            const pt = orbitPoint(o, th, cam);
            if (s === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.strokeStyle = rgba(C.blue, 0.32 * dim);
          ctx.stroke();

          // Comets
          const streamA = eOut3(prog(t, o.reveal + 0.5, 0.6)) * dim;
          if (streamA <= 0) return;
          for (let c = 0; c < 3; c++) {
            const head = c * ((Math.PI * 2) / 3) + t * o.w * 3.2 + oi;
            const dir = Math.sign(o.w);
            const seg = 16;
            for (let s = 0; s < seg; s++) {
              const a1 = head - dir * (s / seg) * 0.55;
              const a2 = head - dir * ((s + 1) / seg) * 0.55;
              const p1 = orbitPoint(o, a1, cam);
              const p2 = orbitPoint(o, a2, cam);
              const front = 0.55 + 0.45 * Math.max(0, p1.depth);
              ctx.strokeStyle = rgba(o.col, (1 - s / seg) * 0.85 * streamA * front);
              ctx.lineWidth = 2.4 * (1 - s / seg) + 0.4;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
            const hp = orbitPoint(o, head, cam);
            ctx.fillStyle = rgba(C.white, 0.9 * streamA);
            ctx.beginPath();
            ctx.arc(hp.x, hp.y, 2.4, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // Labelled system nodes: spokes from the core with outgoing pulses.
        labels.forEach((l, li) => {
          const o = orbits[l.o];
          const th = l.at5 + o.w * (t - 5);
          const pt = orbitPoint(o, th, cam);
          const show = eOut3(prog(t, l.show, 0.45)) * (1 - prog(t, 5.35, 0.4));
          const front = 0.6 + 0.4 * Math.max(0, pt.depth);
          if (show > 0) {
            ctx.strokeStyle = rgba(C.blue, 0.22 * show);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(CX, cam.cy);
            ctx.lineTo(pt.x, pt.y);
            ctx.stroke();
            const ph = ((t - l.show) / 0.9 + li * 0.17) % 1;
            if (t > l.show) {
              const px = CX + (pt.x - CX) * ph;
              const py = cam.cy + (pt.y - cam.cy) * ph;
              ctx.fillStyle = rgba(C.cyan, 0.9 * show * Math.sin(ph * Math.PI));
              ctx.beginPath();
              ctx.arc(px, py, 2.6, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          l.el.style.opacity = (show * front).toFixed(3);
          l.el.style.transform =
            "translate(" + (pt.x - 19).toFixed(1) + "px," + (pt.y - 27).toFixed(1) + "px) scale(" + (0.92 + 0.08 * front).toFixed(3) + ")";
        });

        ctx.globalCompositeOperation = "source-over";
        // Vignette
        const vig = ctx.createRadialGradient(CX, H / 2, 420, CX, H / 2, 1150);
        vig.addColorStop(0, "rgba(7,9,13,0)");
        vig.addColorStop(1, "rgba(7,9,13,0.85)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
      }

      const clock = { t: 0 };
      draw(0);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        clock,
        { t: 0 },
        { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) },
        0,
      );
      window.__timelines["core"] = tl;
    })();
  </script>
</template>
