  <script>
    (function () {
      const SVGNS = "http://www.w3.org/2000/svg";
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const prog = (t, s, d) => clamp((t - s) / d, 0, 1);
      const eIO = gsap.parseEase("power2.inOut");
      const eOut = gsap.parseEase("power3.out");

      // Geometry (matches the CSS boxes above).
      const HUB_X = 712;
      const TRACK_X = HUB_X + 31;
      const ROW_Y = [180 + 142 + 46, 180 + 250 + 46, 180 + 358 + 46, 180 + 466 + 46];
      const ENTRY_Y = ROW_Y[0];
      const EXIT_Y = 180 + 586 - 16;
      const HUB_R = HUB_X + 500;
      const TGT = { x: 1356, y: 510 };
      const CH_Y = [305, 415, 525, 635];

      const inCurves = CH_Y.map((y) => [
        [572, y],
        [650, y],
        [640, ENTRY_Y],
        [HUB_X, ENTRY_Y],
      ]);
      const outCurve = [
        [HUB_R, EXIT_Y],
        [1300, EXIT_Y],
        [1290, TGT.y],
        [TGT.x, TGT.y],
      ];
      const bez = (c, u) => {
        const v = 1 - u;
        return [
          v * v * v * c[0][0] + 3 * v * v * u * c[1][0] + 3 * v * u * u * c[2][0] + u * u * u * c[3][0],
          v * v * v * c[0][1] + 3 * v * v * u * c[1][1] + 3 * v * u * u * c[2][1] + u * u * u * c[3][1],
        ];
      };
      const pathD = (c) =>
        "M" + c[0].join(",") + " C" + c[1].join(",") + " " + c[2].join(",") + " " + c[3].join(",");
      inCurves.forEach((c, i) => document.getElementById("net-l" + i).setAttribute("d", pathD(c)));
      document.getElementById("net-lout").setAttribute("d", pathD(outCurve));

      // Order packets: [channel, emit time]. Illustrative flow, not real traffic.
      const SCHEDULE = [
        [0, 1.0],
        [1, 1.4],
        [2, 1.8],
        [3, 2.2],
        [1, 2.75],
        [0, 3.25],
        [3, 3.75],
        [2, 4.2],
      ];
      const T_IN = 0.7;
      const T_HUB = 1.15;
      const T_OUT = 0.55;

      const packets = SCHEDULE.map(([ch, at]) => {
        const g = document.createElementNS(SVGNS, "g");
        const halo = document.createElementNS(SVGNS, "circle");
        halo.setAttribute("r", "16");
        halo.setAttribute("fill", "rgba(69,224,240,0.18)");
        const dot = document.createElementNS(SVGNS, "rect");
        dot.setAttribute("x", "-7");
        dot.setAttribute("y", "-7");
        dot.setAttribute("width", "14");
        dot.setAttribute("height", "14");
        dot.setAttribute("rx", "3");
        dot.setAttribute("fill", "#45e0f0");
        g.appendChild(halo);
        g.appendChild(dot);
        g.setAttribute("opacity", "0");
        document.getElementById("net-packets").appendChild(g);
        return { ch, at, g, hubAt: at + T_IN, outAt: at + T_IN + T_HUB, doneAt: at + T_IN + T_HUB + T_OUT };
      });

      // Log lines appear at real events of the flow above.
      const events = [];
      packets.forEach((p) => {
        events.push({ at: p.hubAt, text: "POST /webhooks", code: "200" });
        events.push({ at: p.doneAt, text: "sipariş senkron", code: "ok" });
      });
      events.sort((a, b) => a.at - b.at);
      const list = document.getElementById("net-log-list");
      events.forEach((ev, i) => {
        const row = document.createElement("div");
        row.className = "net-log-line";
        row.id = "net-log-" + i;
        row.innerHTML = "<span></span><em></em>";
        row.firstChild.textContent = ev.text;
        row.lastChild.textContent = ev.code;
        list.appendChild(row);
        ev.el = row;
      });
      const VISIBLE = 4;
      const LINE_H = 44;

      const stageGlow = [0, 1, 2, 3].map((i) => document.querySelector("#net-s" + i + " .glow"));
      const hubRing = document.getElementById("net-hub-ring");
      const tgtRing = document.getElementById("net-target-ring");
      const chipDots = [0, 1, 2, 3].map((i) => document.querySelector("#net-ch" + i + " i"));

      // Route inside the hub: down the track past each stage, then along the floor.
      function hubPos(u) {
        const vert = EXIT_Y - ENTRY_Y;
        const horiz = HUB_R - TRACK_X;
        const lead = 31;
        const total = lead + vert + horiz;
        let d = eIO(u) * total;
        if (d < lead) return [HUB_X + d, ENTRY_Y];
        d -= lead;
        if (d < vert) return [TRACK_X, ENTRY_Y + d];
        d -= vert;
        return [TRACK_X + d, EXIT_Y];
      }

      function draw(t) {
        const stage = [0, 0, 0, 0];
        let hub = 0;
        let tgt = 0;
        const chip = [0, 0, 0, 0];
        packets.forEach((p) => {
          let pos = null;
          let a = 1;
          if (t >= p.at && t < p.hubAt) {
            const u = eIO((t - p.at) / T_IN);
            pos = bez(inCurves[p.ch], u);
            a = clamp((t - p.at) / 0.12, 0, 1);
          } else if (t >= p.hubAt && t < p.outAt) {
            pos = hubPos((t - p.hubAt) / T_HUB);
            ROW_Y.forEach((ry, k) => {
              const near = 1 - Math.abs(pos[1] - ry) / 70;
              if (pos[0] <= TRACK_X + 2) stage[k] = Math.max(stage[k], near);
            });
          } else if (t >= p.outAt && t < p.doneAt) {
            pos = bez(outCurve, eIO((t - p.outAt) / T_OUT));
            a = 1 - clamp((t - (p.doneAt - 0.08)) / 0.08, 0, 1);
          }
          hub = Math.max(hub, 1 - Math.abs(t - p.hubAt) / 0.35);
          tgt = Math.max(tgt, t >= p.doneAt ? 1 - (t - p.doneAt) / 0.6 : 0);
          chip[p.ch] = Math.max(chip[p.ch], 1 - Math.abs(t - p.at) / 0.3);
          if (pos) {
            p.g.setAttribute("transform", "translate(" + pos[0].toFixed(1) + "," + pos[1].toFixed(1) + ")");
            p.g.setAttribute("opacity", a.toFixed(3));
          } else {
            p.g.setAttribute("opacity", "0");
          }
        });
        stageGlow.forEach((el, k) => (el.style.opacity = clamp(stage[k], 0, 1).toFixed(3)));
        hubRing.style.opacity = (0.75 * clamp(hub, 0, 1)).toFixed(3);
        tgtRing.style.opacity = clamp(tgt, 0, 1).toFixed(3);
        chipDots.forEach((el, k) => {
          const c = clamp(chip[k], 0, 1);
          el.style.background = c > 0 ? "rgba(69,224,240," + (0.35 + 0.65 * c).toFixed(3) + ")" : "#6e7889";
        });

        // Log: each line fades in at its event; the list scrolls one line per event past the fourth.
        let scroll = 0;
        events.forEach((ev, i) => {
          if (i >= VISIBLE) scroll += LINE_H * eOut(prog(t, ev.at - 0.05, 0.3));
        });
        events.forEach((ev, i) => {
          const k = eOut(prog(t, ev.at, 0.3));
          // Lines leaving the top of the panel fade out instead of being cut.
          const top = i * LINE_H - scroll;
          const keep = clamp(1 + top / (LINE_H * 0.6), 0, 1);
          ev.el.style.opacity = (k * keep).toFixed(3);
        });
        list.style.transform = "translateY(" + (-scroll).toFixed(2) + "px)";
      }

      const clock = { t: 0 };
      draw(0);
      const tl = gsap.timeline({ paused: true });

      // Build: channels, hub, target, then the lines draw on.
      tl.fromTo(
        ".net-chip",
        { opacity: 0, x: -28 },
        { opacity: 1, x: 0, duration: 0.7, ease: "expo.out", stagger: 0.08 },
        0.05,
      );
      tl.fromTo("#net-eyebrow-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.05);
      tl.fromTo(
        "#net-hub",
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" },
        0.2,
      );
      tl.fromTo(
        ".net-stage",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.07 },
        0.45,
      );
      tl.fromTo(
        "#net-eyebrow-out, #net-target, #net-eyebrow-log, #net-log",
        { opacity: 0, x: 28 },
        { opacity: 1, x: 0, duration: 0.7, ease: "expo.out", stagger: 0.08 },
        0.4,
      );
      tl.fromTo(
        "#net-lines path",
        { strokeDasharray: "100 120", strokeDashoffset: 110 },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.06 },
        0.55,
      );

      // Flow clock.
      tl.fromTo(clock, { t: 0 }, { t: 10, duration: 10, ease: "none", onUpdate: () => draw(clock.t) }, 0);

      // Hand-off to the end card: the network recedes behind it.
      tl.fromTo(
        "#net-stage",
        { opacity: 1, scale: 1, filter: "blur(0px)" },
        { opacity: 0.12, scale: 0.97, filter: "blur(10px)", duration: 0.6, ease: "power2.inOut" },
        7.2,
      );
      window.__timelines["net"] = tl;
    })();
  </script>
